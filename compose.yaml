services:
  plc:
    build: .
    command: ["python", "-m", "src.simulator.virtual_plc", "--host", "0.0.0.0"]
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5020), timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10
  app:
    build: .
    init: true
    depends_on:
      plc:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SCADA_PLC_HOST: plc
      SCADA_DB_PATH: /data/scada.db
      # Demo boiler: only temperature setpoint, 20.0–100.0 °C in raw x10 units.
      SCADA_SAFETY_LIMITS: '{"4": [200, 1000]}'
    volumes:
      - history:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  history:
